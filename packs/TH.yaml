# Thailand country pack (planned). Values from PLAN 2.1 and a05. 1 rai = 0,16 ha.
code: TH
name: Thailand
status: planned
currency: {code: THB, symbol: "฿", symbol_spacing: none, display_decimals: 2, minor_unit_exponent: 2}
locale: th-TH
format: {decimal: ".", thousands: ",", date: "D MMM YYYY", datetime: "D MMM YYYY, HH:mm z"}
area_unit: {code: rai, label: "rai", per_hectare: 6.25}
timezones: [{iana: Asia/Bangkok, label: ICT, default: true}]
regulator: {short: OIC, name: "Office of Insurance Commission"}
data_law: "PDPA"
payout_rails: ["PromptPay"]
hazard_sources:
  - {id: tmd, name: "Thai Meteorological Department", kind: warnings}
  - {id: gistda, name: "GISTDA", kind: flood_map}
  - {id: open_meteo, name: "Open-Meteo", kind: forecast}
  - {id: gdacs, name: "GDACS", kind: cyclone}
public_schemes: []
insurers: []
setup_steps:
  - {step: "Currency and formats", done: true}
  - {step: "Area units", done: false}
  - {step: "Regulator review", done: false}
  - {step: "Data law and DPA template", done: false}
  - {step: "Payout rails", done: false}
  - {step: "Hazard data feeds", done: false}
  - {step: "Satellite coverage check", done: false}
  - {step: "Insurer onboarding", done: false}
  - {step: "Pilot clients", done: false}
