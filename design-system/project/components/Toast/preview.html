<!-- @dsCard group="Feedback" height=280 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast preview</title>
<style>.pv{padding:16px 20px}</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol><symbol id="i-rain-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 13v4M12 20h.01"/></symbol></defs></svg>
<div class="pv stack-sm" style="align-items:flex-start">
  <div class="toast in" data-tone="ok" role="status"><svg class="i i-sm" aria-hidden="true"><use href="#i-check"/></svg><span class="toast-text">Payout sent to CV Tani Makmur Demak's wallet</span><a class="toast-action" href="#">View</a></div>
  <div class="toast in" data-tone="info" role="status"><svg class="i i-sm" aria-hidden="true"><use href="#i-info"/></svg><span class="toast-text">Copied</span></div>
  <div class="toast in" data-tone="need" role="status"><svg class="i i-sm" aria-hidden="true"><use href="#i-alert"/></svg><span class="toast-text">Photo needs a retake</span></div>
  <div class="toast in" data-tone="alert" role="status"><svg class="i i-sm" aria-hidden="true"><use href="#i-rain-alert"/></svg><span class="toast-text">Flood warning for Demak</span></div>
</div>

</body>
</html>
