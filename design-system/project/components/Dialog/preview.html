<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialog preview</title>
<style>.pv{padding:16px 20px}</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol></defs></svg>
<div class="pv">
  <div class="wrap-row" style="align-items:flex-start;gap:32px">
    <div style="flex:1 1 360px;max-width:560px">
      <dialog class="modal is-static is-open" open aria-label="Modal preview">
        <div class="ov-head"><h3 class="h-section">Pay Rp13.440.000 from your wallet?</h3></div>
        <div class="ov-body"><p class="muted">Asuransi Jasindo receives the premium and issues your policy straight away.</p></div>
        <div class="ov-foot"><button class="btn btn-soft" type="button">Cancel</button><button class="btn btn-ink" type="button">Pay now</button></div>
      </dialog>
    </div>
    <div style="flex:1 1 320px;max-width:440px">
      <dialog class="sheet is-static is-open" open aria-label="Sheet preview">
        <div class="sheet-grab"></div>
        <div class="ov-head"><h3 class="h-section">Clause 4.1</h3><button class="icon-btn" type="button" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
        <div class="ov-body"><p class="muted">Flood. Loss or damage to the insured crop caused by inundation from rain, river overflow or levee failure, where water covers the crop for at least 3 consecutive days.</p></div>
        <div class="ov-foot"><button class="btn btn-ink" type="button">Got it</button></div>
      </dialog>
    </div>
  </div>
</div>

</body>
</html>
