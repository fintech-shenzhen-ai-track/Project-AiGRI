[project]
name = "aigri"
version = "0.1.0"
description = "AiGRI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.151",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "geoalchemy2>=0.15",
  "boto3>=1.35",
  "apscheduler>=3.10,<4",
  "rfc8785>=0.1.4",
  "pyyaml>=6.0",
  "tzdata>=2025.2",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "types-jsonschema",
  "boto3-stubs",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
markers = ["db: needs a PostgreSQL server (skipped when none is reachable)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"aigri/core/clock.py" = ["DTZ"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aigri.rules.*", "aigri.curation.*", "aigri.wallet.*", "aigri.gateway.*", "aigri.core.*"]
strict = true
